# What is copied: the `defaults` block and the first two jobs of the original, line for line,
# and then the first job of the original that carries `--uma-task oc25` (line 22234 of the
# original). The first two jobs run chgnet, which has no task head, so neither carries it.
# These are jobs of the earlier tasker_flip vacuum-slab production, not of the symmetric
# slabs the project builds now. Paths such as /scratchb/juar/... are the project's own and do
# not exist on your computer.
defaults:
  cwd: /scratchb/juar/EWaste2GreenCat/explicit_solvation
  gpu_required: true
  gpu_min_mem_mib: 12000
  env:
    OMP_NUM_THREADS: '4'
jobs:
- id: Co3O4_100_f0A_thick15A_2x2_chgnet
  cmd:
  - /scratchb/juar/EWaste2GreenCat/explicit_solvation/.venv/chgnet/bin/mlip
  - optimize
  - run
  - --structure
  - 02_vacuum_slabs_v2/Co3O4/100/f0A/chgnet/POSCAR
  - --mlip
  - chgnet
  - --device
  - cuda
  - --optimizer
  - bfgs
  - --fmax
  - '0.05'
  - --max-steps
  - '300'
  output_dir: 02_vacuum_slabs_v2/Co3O4/100/f0A/chgnet
